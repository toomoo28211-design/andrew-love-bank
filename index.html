
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>彥安的戀愛點數銀行</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff2f6;
      font-family: Arial, sans-serif;
      color: #914d67;
    }
    .card {
      width: 85%;
      max-width: 400px;
      padding: 35px 20px;
      background: white;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 6px 24px #dca7b733;
    }
    h1 { font-size: 24px; }
    #status {
      line-height: 1.8;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>♡ 彥安的戀愛點數銀行</h1>
    <p id="status">準備連接 LINE……</p>
  </div>

  <script>
    // 請改成你自己的 LIFF ID
    const LIFF_ID = '2012365860-t6qVKwpc';

    async function start() {
      const status = document.getElementById('status');

      try {
        status.textContent = '正在初始化 LINE……';

        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        if (!liff.isLoggedIn()) {
          status.textContent = '正在前往 LINE 登入……';
          liff.login();
          return;
        }

        const profile = await liff.getProfile();

        status.textContent =
          '❤️ LINE 登入成功！\n你好，' +
          profile.displayName + '！';

      } catch (error) {
        status.textContent =
          'LINE 登入失敗：\n' + error.message;
      }
    }

    window.addEventListener('load', start);
  </script>
</body>
</html>
