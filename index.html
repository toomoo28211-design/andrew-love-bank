<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Andrew Love Bank</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      background: #fff5f8;
      color: #90435f;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }

    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 24px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 20px #b76b851c;
    }

    h1 { font-size: 24px; }

    #status {
      white-space: pre-wrap;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>♡ 彥安的戀愛點數銀行</h1>
    <p id="status">準備連接 LINE……</p>
  </div>

  <script>
    const LIFF_ID = '2012365860-t6qVKwpc';

    async function start() {
      const status = document.getElementById('status');

      try {
        status.textContent = '正在初始化 LINE……';

        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        if (!liff.isLoggedIn()) {
          status.textContent = '正在開啟 LINE 登入……';
          liff.login();
          return;
        }

        const profile = await liff.getProfile();

        status.textContent =
          '❤️ LINE 登入成功！\n' +
          '你好，' + profile.displayName + '！\n' +
          '下一步就可以串接戀愛點數銀行。';

      } catch (error) {
        status.textContent =
          '登入失敗：\n' +
          (error.message || String(error));
      }
    }

    window.addEventListener('load', start);
  </script>
</body>
</html>
